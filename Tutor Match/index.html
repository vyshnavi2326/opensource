<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMatch - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }

        .navbar {
            background-color: #0D1B2A;
        }

        .navbar .navbar-brand,
        .navbar .nav-link {
            color: #fff !important;
        }

        .navbar .nav-link:hover {
            color: #d4a373 !important;
        }

        .modal-content {
            background-color: #fefae0;
            border-radius: 10px;
            border: 2px solid #1B263B;
        }

        .modal-header {
            background-color: #415A77;
            color: #fff;
        }

        .modal-body {
            font-size: 1.1rem;
            text-align: center;
        }

        .modal-body p {
            margin-bottom: 20px;
            font-weight: 600;
        }

        .btn {
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #1B263B;
            border: none;
        }

        .btn-primary:hover {
            background-color: #778DA9;
        }

        .btn-success {
            background-color: #415A77;
            border: none;
        }

        .btn-success:hover {
            background-color: #0D1B2A;
        }

        .btn-close {
            background-color: #d4a373;
            border: none;
        }

        .btn-close:hover {
            background-color: #778DA9;
        }
    </style>
</head>

<body>
    <!-- nav bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">EduMatch</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Tutor_Login.html">Tutor Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Student_Login.html">Student Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Modal for Login Prompt -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Welcome to EduMatch!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Please select your login type:</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="Student_Login.html" class="btn btn-primary">Student Login</a>
                        <a href="Tutor_Login.html" class="btn btn-success">Tutor Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Show the modal when the page is loaded
        window.onload = function () {
            var myModal = new bootstrap.Modal(document.getElementById('loginModal'), {
                keyboard: false
            });
            myModal.show();
        };
    </script>
</body>

</html>
