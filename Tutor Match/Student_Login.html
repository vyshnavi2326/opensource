<body class="bg-gray-50">

<div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-900">Student Registration</h2>
      <p class="mt-2 text-gray-600">Tell us about yourself to get started</p>
    </div>

    <form class="space-y-6">

      <!-- Student Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          <div class="flex items-center gap-2">
            <span class="lucide lucide-user h-4 w-4"></span> Student Name
          </div>
        </label>
        <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Enter your full name">
      </div>

      <!-- Education Status -->
      <div class="space-y-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          <div class="flex items-center gap-2">
            <span class="lucide lucide-graduation-cap h-4 w-4"></span> Current Education Status
          </div>
        </label>
        <select required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
          <option value="">Select your education level</option>
          <option value="high_school">High School</option>
          <option value="undergraduate">Undergraduate</option>
          <option value="graduate">Graduate</option>
          <option value="phd">PhD</option>
          <option value="other">Other</option>
        </select>
        <input type="text" required class="w-full mt-3 px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Please specify your education status">
      </div>

      <!-- Contact Information -->
      <div class="space-y-4">
        <label class="block text-sm font-medium text-gray-700">
          <div class="flex items-center gap-2">
            <span class="lucide lucide-mail h-4 w-4"></span> Contact Information
          </div>
        </label>
        <div class="flex gap-4">
          <select class="w-32 px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
            <option value="email">Email</option>
            <option value="phone">Phone</option>
          </select>
          <input type="text" required class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Enter your contact">
        </div>
      </div>

      <!-- Message to Tutor -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          <div class="flex items-center gap-2">
            <span class="lucide lucide-message-square h-4 w-4"></span> Message to Your Tutor
          </div>
        </label>
        <textarea required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" rows="3" placeholder="What would you like your tutor to know about your learning goals?"></textarea>
      </div>

      <!-- About You -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">About You (in 100 words)</label>
        <textarea required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" rows="4" maxlength="400" placeholder="Tell us about yourself, your interests, and your learning style..."></textarea>
        <p class="mt-1 text-sm text-gray-500">0/400 characters</p>
      </div>

      <!-- Comfortable Languages -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          <div class="flex items-center gap-2">
            <span class="lucide lucide-languages h-4 w-4"></span> Comfortable Languages (Choose 3)
          </div>
        </label>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Language 1">
          <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Language 2">
          <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Language 3">
        </div>
      </div>
          <!-- Submit Button -->
          <div>
            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
              Register as Student
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      lucide.createIcons();

      // Capture form submission
      document.getElementById('registrationForm').addEventListener('submit', function (e) {
        e.preventDefault();  // Prevent form from submitting normally

        // Capture form data
        const studentName = document.querySelector('input[name="studentName"]').value;
        const educationStatus = document.querySelector('select[name="educationStatus"]').value;
        const contactInfo = document.querySelector('input[name="contactInfo"]').value;
        const messageToTutor = document.querySelector('textarea[name="messageToTutor"]').value;
        const aboutYou = document.querySelector('textarea[name="aboutYou"]').value;
        const languages = Array.from(document.querySelectorAll('input[name="languages"]')).map(input => input.value);

        // Store data in local storage
        localStorage.setItem('studentName', studentName);
        localStorage.setItem('educationStatus', educationStatus);
        localStorage.setItem('contactInfo', contactInfo);
        localStorage.setItem('messageToTutor', messageToTutor);
        localStorage.setItem('aboutYou', aboutYou);
        localStorage.setItem('languages', JSON.stringify(languages));

        // Redirect to profile page
        window.location.href = 'profile.html';
      });
    </script>
  </body>
</html>
