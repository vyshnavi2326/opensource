<body>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor Registration</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body>
  <div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-8">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-900">Tutor Registration</h2>
        <p class="mt-2 text-gray-600">Share your expertise and start teaching</p>
      </div>

      <form class="space-y-6">
        <!-- Tutor Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Tutor Name
          </label>
          <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Enter your full name">
        </div>

        <!-- Graduated From -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Graduated From
          </label>
          <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Enter your university/institution name">
        </div>

        <!-- Current Status -->
<div>
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Current Status
    </label>
    <select required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
      <option value="" disabled selected>Select your status</option>
      <option value="Professor">Professor</option>
      <option value="Research Scholar">Research Scholar</option>
      <option value="Industry Professional">Industry Professional</option>
      <option value="Other">Other</option>
    </select>
  </div>
        <!-- Contact Information -->
        <div class="space-y-4">
          <label class="block text-sm font-medium text-gray-700">
            Contact Information
          </label>
          <div class="flex gap-4">
            <select class="w-32 px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
              <option value="email">Email</option>
              <option value="phone">Phone</option>
            </select>
            <input type="text" required class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Enter your email or phone number">
          </div>
        </div>

        <!-- Experience -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Experience (Years)
          </label>
          <input type="number" required min="0" max="50" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Years of teaching experience">
        </div>

        <!-- Specialization -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Specialization
          </label>
          <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Your main area of expertise">
        </div>

        <!-- Areas of Expertise -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Areas of Expertise
          </label>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Expertise 1">
            <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Expertise 2">
            <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Expertise 3">
          </div>
        </div>

        <!-- About Tutor -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            About You (in 100 words)
          </label>
          <textarea required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" rows="4" maxlength="400" placeholder="Tell us about your teaching philosophy and experience..."></textarea>
        </div>

        <!-- Comfortable Languages -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Comfortable Languages
          </label>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Language 1">
            <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Language 2">
            <input type="text" required class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Language 3">
          </div>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
            Register as Tutor
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
</body>
</html>
