<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="studentRegistrationForm" class="space-y-6">
        <div>
          <input type="text" name="name" required class="w-full px-3 py-2 border rounded-lg" placeholder="Enter your full name">
        </div>
        <div>
          <select name="educationStatus" required class="w-full px-3 py-2 border rounded-lg">
            <option value="">Select your education level</option>
            <option value="high_school">High School</option>
            <option value="undergraduate">Undergraduate</option>
            <option value="graduate">Graduate</option>
            <option value="phd">PhD</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <input type="text" name="contact" required class="w-full px-3 py-2 border rounded-lg" placeholder="Enter your contact">
        </div>
        <div>
          <textarea name="message" required class="w-full px-3 py-2 border rounded-lg" rows="3" placeholder="Message to Your Tutor"></textarea>
        </div>
        <div>
          <textarea name="about" required class="w-full px-3 py-2 border rounded-lg" rows="4" maxlength="400" placeholder="Tell us about yourself"></textarea>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <input type="text" name="languages[]" required class="px-3 py-2 border rounded-lg" placeholder="Language 1">
          <input type="text" name="languages[]" required class="px-3 py-2 border rounded-lg" placeholder="Language 2">
          <input type="text" name="languages[]" required class="px-3 py-2 border rounded-lg" placeholder="Language 3">
        </div>
        <button type="button" id="registerButton" class="w-full py-3 px-4 bg-indigo-600 text-white rounded-lg">Register as Student</button>
      </form>

      <script>
        document.getElementById('registerButton').addEventListener('click', async () => {
          const form = document.getElementById('studentRegistrationForm');
          const formData = new FormData(form);
          const data = Object.fromEntries(formData.entries());
          data.languages = formData.getAll('languages[]'); // Handle multiple languages
      
          try {
            const response = await fetch('http://localhost:5000/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data),
            });
      
            const result = await response.json();
            if (response.ok) {
              alert(result.message);
              console.log(result.profile);
            } else {
              alert('Error: ' + result.message);
            }
          } catch (error) {
            console.error('Error:', error);
            alert('Failed to register. Please try again later.');
          }
        });
      </script>
      

      
</body>
</html>
